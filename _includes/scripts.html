<script src="{{ site.baseurl }}/js/jquery.min.js"></script>
<script src="{{ site.baseurl }}/js/scrollreveal.min.js"></script>
<script src="{{ site.baseurl }}/js/particles.min.js"></script>
<script src="{{ site.baseurl }}/js/main.js?v=2"></script>
<script type="module">
  import { _parts, serializeVars } from '{{ site.baseurl }}/js/blobatar-internal.js';
  import { gaze } from '{{ site.baseurl }}/js/blobatar-gaze.js';

  const svg = document.querySelector('.blobatar');
  if (svg) {
    const { cls, inner, vars } = _parts('alain00', { animate: 'always' });
    svg.innerHTML = `<g class="${cls}" style="${serializeVars(vars)}">${inner}</g>`;
    gaze(svg.firstChild, { target: 'pointer' });
  }
</script>
